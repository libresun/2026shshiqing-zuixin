function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
}

let wrongList = [];
let answeredSet = new Set();

function render(){
    const wrap = document.getElementById("questionWrap");
    wrap.innerHTML = "";
    wrongList = [];
    answeredSet.clear();
    document.getElementById("summaryBtn").disabled = true;
    const total = questionBank.length;
    updateProgress(total);
    const shuffledQuestions = shuffle(questionBank);

    shuffledQuestions.forEach((qObj, idx)=>{
        const div = document.createElement("div");
        div.className = "q-item";
        div.dataset.answer = qObj.ans;
        div.dataset.qid = idx;
        div.innerHTML += `<div class="q-title">${idx+1}. ${qObj.q}</div>`;
        const shuffledOpts = shuffle(qObj.options);
        shuffledOpts.forEach(optText=>{
            const optDiv = document.createElement("div");
            optDiv.className = "opt";
            optDiv.innerText = optText;
            optDiv.dataset.text = optText;
            div.appendChild(optDiv);
        });
        const hint = document.createElement("div");
        hint.className = "answer-hint";
        hint.innerText = "✅正确答案：" + qObj.ans;
        div.appendChild(hint);

        div.querySelectorAll(".opt").forEach(opt=>{
            opt.onclick = function(){
                if(answeredSet.has(idx)) return;
                answeredSet.add(idx);
                const userAnswer = this.dataset.text;
                div.querySelectorAll(".opt").forEach(o=>o.classList.remove("user-select"));
                this.classList.add("user-select");
                const correctAns = div.dataset.answer;
                const hintDom = div.querySelector(".answer-hint");
                hintDom.classList.add("show");
                div.querySelectorAll(".opt").forEach(optDom=>{
                    const t = optDom.dataset.text;
                    if(t === correctAns){
                        optDom.classList.add("right");
                    }
                    if(t === userAnswer && userAnswer !== correctAns){
                        optDom.classList.add("wrong");
                        wrongList.push({question:qObj.q,yourAnswer:userAnswer,correctAnswer:correctAns});
                    }
                });
                updateProgress(total);
                if(answeredSet.size >= total){
                    document.getElementById("summaryBtn").disabled = false;
                }
            }
        });
        wrap.appendChild(div);
    });

    document.getElementById("summaryBtn").onclick = function(){
        let msg;
        if(wrongList.length ===0){
            msg = "🎉恭喜你！本次全部题目作答正确！";
        }else{
            msg = `❌本次错题一共 ${wrongList.length} 道：\n\n`;
            wrongList.forEach((w,i)=>{
                msg += `${i+1}.【题干】${w.question}\n👉你的选择：${w.yourAnswer}\n✅标准答案：${w.correctAnswer}\n\n`;
            });
        }
        alert(msg);
    };
    document.getElementById("resetBtn").onclick = render;
}

function updateProgress(total){
    const count = answeredSet.size;
    document.getElementById("progressInfo").innerText = `已作答：${count} / ${total} ｜点击选项，立刻查看本题对错`;
}

window.onload = render;
</script>
